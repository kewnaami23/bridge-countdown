<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>নড়িয়া ব্রীজ কাউন্টডাউন</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.container{
background:rgba(255,255,255,0.08);
padding:40px;
border-radius:20px;
width:90%;
max-width:700px;
}

h1{
font-size:26px;
margin-bottom:10px;
}

.subtitle{
opacity:0.7;
margin-bottom:20px;
}

.timer{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.box{
background:rgba(0,0,0,0.4);
padding:20px;
border-radius:12px;
width:100px;
font-size:32px;
font-weight:bold;
}

.label{
font-size:14px;
opacity:0.8;
margin-top:5px;
}

.progress{
margin-top:30px;
height:10px;
background:rgba(255,255,255,0.2);
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#4facfe;
transition:1s;
}

.stats{
margin-top:20px;
font-size:16px;
opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<h1>শফিকুর রহমান কিরনের ওয়াদা অনুযায়ী নড়িয়া ব্রীজ চালু হতে বাকি</h1>

<div class="subtitle">১২ ফেব্রুয়ারি ২০২৬ → ১২ আগস্ট ২০২৬</div>

<div class="timer">

<div class="box">
<div id="days">0</div>
<div class="label">দিন</div>
</div>

<div class="box">
<div id="hours">0</div>
<div class="label">ঘণ্টা</div>
</div>

<div class="box">
<div id="minutes">0</div>
<div class="label">মিনিট</div>
</div>

<div class="box">
<div id="seconds">0</div>
<div class="label">সেকেন্ড</div>
</div>

</div>

<div class="progress">
<div class="bar" id="progress"></div>
</div>

<div class="stats">
<p>এ পর্যন্ত কেটেছে: <span id="passedDays">0</span> দিন</p>
<p>মোট ভিজিটর: <span id="visitors">0</span></p>
</div>

</div>

<script>

const startDate = new Date("Feb 12, 2026 00:00:00").getTime();
const endDate = new Date("Aug 12, 2026 00:00:00").getTime();

function update(){

const now = new Date().getTime();
const distance = endDate - now;

if(distance <= 0){
document.querySelector(".timer").innerHTML = "<h2>সময় শেষ</h2>";
document.getElementById("progress").style.width="100%";
return;
}

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

const total = endDate - startDate;
const passed = now - startDate;
const percent = (passed/total)*100;

document.getElementById("progress").style.width = percent + "%";

const passedDays = Math.floor(passed/(1000*60*60*24));
document.getElementById("passedDays").innerHTML = passedDays;

}

update();
setInterval(update,1000);


/* Simple Visitor Counter */

let visits = localStorage.getItem("visit-count");

if(!visits){
visits = 0;
}

visits++;

localStorage.setItem("visit-count", visits);

document.getElementById("visitors").innerText = visits;

</script>

</body>
</html>
