<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নড়িয়া ব্রীজ কাউন্টডাউন</title>

<style>
body{
font-family:Segoe UI;
text-align:center;
background:#0f2027;
color:white;
padding-top:80px;
}

.timer{
display:flex;
justify-content:center;
gap:20px;
margin-top:40px;
}

.box{
background:#203a43;
padding:20px;
border-radius:10px;
width:100px;
font-size:30px;
}

span{
display:block;
font-size:14px;
margin-top:5px;
}
</style>

</head>

<body>

<h1>শফিকুর রহমান কিরনের ওয়াদা মোতাবেক নড়িয়া ব্রীজ চালু করতে বাকি</h1>

<div class="timer">
<div class="box"><div id="days">0</div><span>Days</span></div>
<div class="box"><div id="hours">0</div><span>Hours</span></div>
<div class="box"><div id="minutes">0</div><span>Minutes</span></div>
<div class="box"><div id="seconds">0</div><span>Seconds</span></div>
</div>

<script>

const endDate = new Date("Aug 12, 2026 00:00:00").getTime();

function update(){

const now = new Date().getTime();
const distance = endDate - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

}

setInterval(update,1000);

</script>

</body>
</html>
